<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cierre de la master class — Divino</title>
<meta name="description" content="Formulario breve de cierre de la master class de IA en Divino.">
<meta name="robots" content="noindex">
<!-- los assets viven en /assets/ del repo del sitio: desde /divino/mcfeedback.html, ../assets/ llega ahí -->
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens del design system de Victoria Perez (colors_and_type.css),
   con la misma composición del barómetro */
:root{
  --color-violet-deep:#4B2C7A; --color-violet-main:#6A3FA0; --color-violet-mid:#8B5CC7;
  --color-violet-soft:#C4A8E0; --color-violet-pale:#EDE6F6; --color-violet-ghost:#F7F3FC;
  --color-amber:#F2A93B; --color-amber-light:#FAD38A; --color-amber-pale:#FEF3DC;
  --color-ink:#1A1A1A; --color-ink-secondary:#5F6368; --color-ink-muted:#9AA0A6;
  --color-border:#E0E0E0; --color-surface:#FAFAFA; --color-white:#FFFFFF;

  --fg-primary:var(--color-ink); --fg-secondary:var(--color-ink-secondary); --fg-muted:var(--color-ink-muted);
  --bg-base:var(--color-white); --bg-subtle:var(--color-violet-ghost); --bg-soft:var(--color-violet-pale);
  --border-default:var(--color-border); --border-brand:var(--color-violet-main); --border-subtle:var(--color-violet-pale);

  --font-family:'Raleway',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-pill:9999px;
  --shadow-xs:0 1px 2px rgba(74,44,122,0.06);
  --shadow-sm:0 2px 6px rgba(74,44,122,0.08), 0 1px 2px rgba(74,44,122,0.04);
  --shadow-md:0 4px 16px rgba(74,44,122,0.12), 0 2px 4px rgba(74,44,122,0.06);
  --transition-fast:150ms cubic-bezier(0.4,0,0.2,1);
  --transition-base:250ms cubic-bezier(0.4,0,0.2,1);
  --focus-ring:0 0 0 3px rgba(106,63,160,0.25);

  /* error: el design system no lo define */
  --error:#B3261E; --error-bg:#FDECEA; --error-soft:#E6B3AE;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-family);font-weight:400;font-size:16px;line-height:1.5;
  color:var(--fg-primary);background:var(--bg-base);-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
button,input,textarea{font-family:inherit}
strong{font-weight:700}

/* ---------- encabezado del sitio ---------- */
.site{background:rgba(255,255,255,0.95);border-bottom:1px solid var(--border-default)}
.site-inner{max-width:800px;margin:0 auto;padding:0 8px;height:72px;display:flex;align-items:center}
/* mismo tamaño que el logo del barómetro: 60 px en celular, 78 px desde 768 px */
.site .logo{height:60px;width:auto;display:block}

/* ---------- barra de progreso: la que queda fija ---------- */
.bar{
  position:sticky;top:0;z-index:20;background:var(--bg-base);
  border-bottom:1px solid var(--border-default);box-shadow:var(--shadow-xs);
}
.bar-inner{max-width:800px;margin:0 auto;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.bar-title{font-size:15px;font-weight:600;color:var(--fg-primary)}
.track{height:6px;background:var(--bg-soft);border-radius:var(--radius-pill);overflow:hidden}
.fill{height:100%;width:0;background:var(--color-violet-main);border-radius:var(--radius-pill);transition:width var(--transition-base)}
.bar-count{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar-paso{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-violet-main)}
.bar-sub{font-size:13px;color:var(--fg-secondary);text-align:right}

/* ---------- layout ---------- */
.shell{flex:1;width:100%;max-width:800px;margin:0 auto;padding:20px 16px 32px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- tipografía ---------- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-violet-main);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.02em;color:var(--fg-primary)}
h2.q{font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.02em;color:var(--fg-primary);margin-bottom:8px}
.hint{font-size:16px;line-height:1.6;color:var(--fg-secondary);margin-bottom:18px;text-wrap:pretty}
p{text-wrap:pretty}

/* ---------- tarjetas y avisos ---------- */
.card{
  background:var(--bg-base);border:1px solid var(--border-default);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);padding:18px;margin-bottom:18px;
}
.intro{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.intro .card{padding:20px 18px;margin:0;display:flex;flex-direction:column;gap:14px}
.intro .lead{font-size:17px;line-height:1.6;color:var(--fg-secondary)}
.intro .card p:not(.lead){font-size:16px;line-height:1.7;color:var(--fg-primary)}
.nota{
  background:var(--color-amber-pale);border:1px solid var(--color-amber-light);border-radius:var(--radius-lg);
  padding:16px;display:flex;gap:12px;align-items:flex-start;
}
.nota p{font-size:15px;line-height:1.65;color:var(--color-ink)}
.nota-ico{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--color-amber);display:inline-flex;align-items:center;justify-content:center;margin-top:2px}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;background:var(--bg-soft);color:var(--color-violet-main)}
.opc{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;background:var(--color-violet-pale);color:var(--color-violet-main)}

/* contexto de una pregunta: tarjeta suave del design system */
.caso{background:var(--bg-soft);border:1px solid var(--color-violet-soft);border-radius:var(--radius-lg);padding:16px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.caso-lbl{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-violet-main)}
.caso p{font-size:15px;line-height:1.65;color:var(--color-ink)}

/* ---------- opciones ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.opt{
  display:flex;align-items:flex-start;gap:12px;min-height:48px;
  background:var(--bg-base);border:1.5px solid var(--border-default);border-radius:var(--radius-lg);
  padding:13px 14px;cursor:pointer;
  transition:border-color var(--transition-fast),background var(--transition-fast),box-shadow var(--transition-fast);
  -webkit-tap-highlight-color:transparent;
}
.opt:hover{border-color:var(--color-violet-soft);background:var(--bg-subtle)}
.opt.sel{border-color:var(--border-brand);background:var(--bg-subtle);box-shadow:var(--shadow-sm)}
.mark{
  flex:0 0 22px;width:22px;height:22px;margin-top:1px;
  border:2px solid var(--color-violet-soft);background:var(--bg-base);
  display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);
}
.mark.radio{border-radius:50%}
.opt.sel .mark{border-color:var(--color-violet-main);background:var(--color-violet-main)}
.mark::after{content:'';opacity:0;transition:opacity var(--transition-fast)}
.mark.radio::after{width:8px;height:8px;border-radius:50%;background:var(--color-white)}
.opt.sel .mark::after{opacity:1}
.opt-txt{flex:1;font-size:16px;line-height:1.45;color:var(--fg-primary)}
.opt.sel .opt-txt{font-weight:600}

/* ---------- campos de texto ---------- */
input[type=text],input[type=email],textarea{
  width:100%;min-height:48px;font-size:16px;color:var(--color-ink);
  background:var(--color-white);border:1.5px solid var(--color-violet-soft);border-radius:var(--radius-md);
  padding:12px 14px;transition:border-color var(--transition-fast),box-shadow var(--transition-fast);
}
input::placeholder,textarea::placeholder{color:var(--fg-muted)}
input[type=text]:focus,input[type=email]:focus,textarea:focus{outline:none;border-color:var(--color-violet-main);box-shadow:var(--focus-ring)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
label.fl{display:block;font-weight:600;font-size:16px;margin-bottom:8px;color:var(--fg-primary)}
.field{margin-bottom:18px}

/* segunda pregunta del paso 9: separada con una línea, aparece con el sí */
.field.abierta{margin-top:22px;padding-top:20px;border-top:1px solid var(--border-default)}
.ab-wrap{display:none}
.ab-wrap.on{display:block;animation:in .2s ease}

/* ---------- escala de 1 a 5: botones del design system ---------- */
.escala5{margin-bottom:8px}
/* Raleway dibuja los números de estilo antiguo (3, 4 y 5 bajan): se piden los de altura pareja */
.escala5,.num,.bar-count{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.num{
  display:flex;align-items:center;justify-content:center;padding:0;
  min-height:56px;font-size:20px;line-height:1;font-weight:600;color:var(--fg-primary);
  background:var(--bg-base);border:1.5px solid var(--border-default);border-radius:var(--radius-md);
  cursor:pointer;transition:all var(--transition-fast);-webkit-tap-highlight-color:transparent;
}
.num:hover{border-color:var(--color-violet-soft)}
.num.sel{border-color:var(--border-brand);background:var(--bg-soft);color:var(--color-violet-deep)}
.num:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.nums-lbl{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--fg-secondary)}

/* ---------- claridad por tema: tarjeta con estado y pastillas ---------- */
.temas{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.item{
  background:var(--bg-base);border:1px solid var(--border-default);border-radius:var(--radius-lg);
  transition:border-color var(--transition-fast),box-shadow var(--transition-fast);
}
.tema-head{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 12px}
.estado{flex:0 0 22px;height:22px;margin-top:1px;border-radius:50%;border:2px dashed var(--color-violet-soft);display:flex;align-items:center;justify-content:center}
.item.done .estado{border:2px solid var(--color-violet-main);background:var(--color-violet-main)}
.item.done .estado::after{content:'';width:5px;height:10px;border:solid var(--color-white);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item-txt{flex:1;font-size:16px;line-height:1.45;font-weight:600;color:var(--fg-primary)}
/* tres opciones del mismo ancho, como «No sé qué es / Sé qué es» del barómetro */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 14px 14px}
.chip{
  min-height:52px;padding:8px 6px;font-size:14px;line-height:1.25;text-align:center;color:var(--color-violet-deep);
  background:var(--bg-subtle);border:1.5px solid var(--color-violet-soft);border-radius:var(--radius-md);
  cursor:pointer;transition:all var(--transition-fast);-webkit-tap-highlight-color:transparent;
}
.chip:hover{border-color:var(--color-violet-main)}
.chip.sel{background:var(--color-violet-main);border-color:var(--color-violet-main);color:var(--color-white);font-weight:600}
.chip:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* ---------- navegación: fija abajo mientras se recorre el paso ---------- */
.nav{
  position:sticky;bottom:0;z-index:30;background:var(--bg-base);border-top:1px solid var(--border-default);
  padding:12px 16px calc(16px + env(safe-area-inset-bottom));
}
.nav-inner{max-width:768px;margin:0 auto;display:flex;gap:12px;align-items:center}
button.btn{
  min-height:48px;font-size:16px;font-weight:600;border-radius:var(--radius-md);cursor:pointer;
  transition:background var(--transition-fast),transform var(--transition-fast);-webkit-tap-highlight-color:transparent;
}
button.btn:active{transform:scale(.97)}
button.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.btn.primary{flex:1;border:none;background:var(--color-violet-main);color:var(--color-white);box-shadow:0 2px 6px rgba(74,44,122,0.2)}
.btn.primary:hover{background:var(--color-violet-deep)}
.btn.ghost{padding:0 20px;border:1.5px solid var(--color-violet-main);background:transparent;color:var(--color-violet-main)}
.btn.ghost:hover{background:var(--bg-subtle)}

/* ---------- errores de validación ---------- */
input.invalid,textarea.invalid{border-color:var(--error);background:var(--error-bg)}
.opts.invalid .opt{border-color:var(--error-soft)}
.escala5.invalid .num{border-color:var(--error-soft)}
.item.invalid{border:1.5px solid var(--error);background:var(--error-bg)}
.item.invalid .estado{border-color:var(--error)}
.err{color:var(--error);font-size:14px;font-weight:600;margin-top:6px}
.opts + .err,.escala5 + .err,.temas + .err{margin:-2px 0 12px}

/* ---------- agradecimiento y cierre ---------- */
.resultado{padding-top:8px}
.resultado h1{font-size:26px;line-height:1.25;margin-bottom:18px}
.card-intro{font-size:17px;line-height:1.65;color:var(--fg-primary)}
.envio{font-size:14px;color:var(--fg-secondary)}
.envio.err{color:var(--error);font-weight:600}

@media(max-width:559px){ .bar-long{display:none} }
@media(min-width:768px){
  .site-inner{height:88px;padding:0 28px}
  .site .logo{height:78px}
  .bar-inner{padding:16px 40px 18px;gap:12px}
  .bar-title{font-size:18px}
  .shell{padding:40px 40px 48px}
  h1{font-size:40px;line-height:1.15}
  h2.q{font-size:32px;line-height:1.2;max-width:34ch;margin-bottom:10px}
  .hint{font-size:18px;max-width:62ch}
  .opt{padding:16px 18px}
  .opt-txt{font-size:17px}
  .intro{gap:20px;padding-top:8px}
  .intro .card{padding:40px;gap:18px}
  .intro .lead{font-size:20px;line-height:1.7;max-width:60ch}
  .intro .card p:not(.lead){max-width:68ch}
  .nota{padding:24px 28px;gap:14px}
  .nota p{font-size:16px;line-height:1.7;max-width:66ch}
  .caso{padding:24px 28px}
  .caso p{font-size:16px;line-height:1.7;max-width:66ch}
  .nums{max-width:480px;gap:10px}
  .num{min-height:60px}
  .nums-lbl{max-width:480px}
  .tema-head{padding:18px 20px 12px;gap:14px}
  .item-txt{font-size:17px}
  .chips{padding:0 20px 18px 58px;gap:10px;max-width:640px}
  .chip{min-height:48px;padding:8px 12px;font-size:15px}
  textarea,.field input{max-width:640px}
  .nav{padding:16px 40px calc(16px + env(safe-area-inset-bottom))}
  .nav-inner{justify-content:space-between}
  button.btn{min-height:52px;font-size:17px}
  .btn.ghost{padding:0 28px}
  .btn.primary{flex:0 0 auto;min-width:200px;padding:0 32px;margin-left:auto}
  .resultado h1{font-size:40px;line-height:1.15;margin-bottom:24px}
  .resultado .card{padding:32px}
  .card-intro{font-size:20px;line-height:1.6;max-width:56ch}
  .envio{font-size:15px}
}
</style>
</head>
<body>

<header class="site">
  <div class="site-inner"><img class="logo" src="../assets/logo-full-white.png" alt="Victoria Perez" width="180" height="60"></div>
</header>

<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <span class="bar-title">Master class<span class="bar-long"> · qué te llevás</span></span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="bar-count"><span class="bar-paso" id="count"></span><span class="bar-sub" id="countsub"></span></div>
  </div>
</div>

<main class="shell" id="shell"></main>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <button class="btn ghost" id="back" hidden>Atrás</button>
    <button class="btn primary" id="next">Empezar</button>
  </div>
</nav>

<script>
/* ==========================================================================
   CIERRE DE LA MASTER CLASS — DIVINO
   Contenido: talleres/divino_adopcionia_2026/6.3_formulario-post-masterclass.md
   Evalúa cómo llegó la master class: utilidad, claridad por tema, qué fue
   útil, qué quedó pendiente e interés en los talleres de especialización.
   La persona ve un agradecimiento, sin puntaje.
   ========================================================================== */

/* Endpoint del Google Apps Script desplegado como web app.
   Con la constante vacía el formulario funciona igual y guarda en localStorage. */
const ENDPOINT = "";

/* Cierre. El script tiene la misma fecha y es el que deja de escribir filas.
   Hora de Uruguay, sin horario de verano. */
const FECHA_CIERRE = new Date("2026-09-30T23:59:59-03:00");

/* Vista previa de la pantalla de cierre: agregar ?vista=cierre a la URL */
const CERRADO = new URLSearchParams(location.search).get("vista")==="cierre" || new Date() > FECHA_CIERRE;

/* ---------- contenido de las preguntas ---------- */

/* Temas del paso 4. Cada uno es una columna de la hoja: p4_claridad_<k>.
   [PENDIENTE] ajustar al contenido definitivo de la master class. Si cambia la
   clave k, cambia también la lista COLS del script. */
const TEMAS = [
  {k:"pedidos",     t:"Dar contexto y armar mejores pedidos"},
  {k:"verificar",   t:"Verificar lo que devuelve"},
  {k:"informacion", t:"Qué información va a dónde"}
];
const NIVELES = ["Me quedó claro","Me quedó a medias","Todavía me cuesta"];

/* opciones del paso 9 que dicen que sí: abren el por qué y el paso 10 */
const INTERES = [0,1];

const Q = [

/* 1 · nombre y correo */
{id:"identidad", tipo:"campos", eyebrow:"Antes de empezar",
  t:"¿Quién sos?",
  hint:"Usá el mismo correo con el que respondiste el formulario inicial: es lo que une las dos respuestas.",
  campos:[
    {id:"nombre", label:"Nombre y apellido", ph:"Nombre y apellido", ac:"name", cap:"words"},
    {id:"mail",   label:"Tu correo", ph:"tu@correo.com", mail:true, ac:"email", cap:"off"}
  ]},

/* 2 · utilidad — escala de 1 a 5 */
{id:"p2", tipo:"escala", eyebrow:"Qué te llevás",
  t:"¿Qué tan útil te resultó la master class para tu trabajo?",
  hint:"Tocá un número del 1 al 5.",
  extremos:["1 · Poco útil","5 · Muy útil"]},

/* 3 · de qué se trató — obligatoria */
{id:"p3", tipo:"largo", eyebrow:"Qué te llevás", req:true,
  t:"Si tuvieras que contarle a alguien de tu equipo de qué se trató la master class, ¿qué le dirías?",
  hint:"En pocas palabras, como se lo contarías.",
  ph:"Lo que le dirías",
  err:"Contanos en pocas palabras de qué se trató."},

/* 4 · claridad por tema */
{id:"p4", tipo:"claridad", eyebrow:"Qué te llevás",
  t:"¿Qué tan claro te quedó cada tema?",
  hint:"Elegí una opción en cada uno.",
  subProgreso:()=>`${Object.keys(R.p4||{}).length} de ${TEMAS.length} temas`},

/* 5 · qué llegó — obligatoria */
{id:"p5", tipo:"largo", eyebrow:"Qué te llevás", req:true,
  t:"¿Qué te resultó más útil de lo que vimos hoy?",
  ph:"Lo que más te sirvió",
  err:"Contanos qué te resultó más útil."},

/* 6 · qué cambiarías — opcional */
{id:"p6", tipo:"largo", eyebrow:"Qué te llevás", opcional:true,
  t:"¿Qué te hubiera gustado que fuera distinto?",
  hint:"Podés pensar en el tiempo, el enfoque, el formato o la dinámica.",
  ph:"Lo que cambiarías"},

/* 7 · compromiso concreto — obligatoria */
{id:"p7", tipo:"texto", eyebrow:"Qué te llevás", req:true,
  t:"¿Qué tarea concreta de tu semana vas a probar con IA?",
  hint:"Una línea alcanza.", ph:"La tarea que vas a probar",
  err:"Escribí la tarea que vas a probar: una línea alcanza."},

/* 8 · lo que quedó pendiente — opcional */
{id:"p8", tipo:"largo", eyebrow:"Qué falta", opcional:true,
  t:"¿Qué quedó dando vueltas?",
  hint:"Algo que quisiste preguntar y quedó para otro momento.",
  ph:"Tu pregunta o tu duda"},

/* 9 · Seguir: interés en los talleres de especialización, y por qué */
{id:"p9", tipo:"radio", eyebrow:"Seguir",
  caso:{lbl:"Lo que viene", html:
    `<p><strong>Después de la master class vienen talleres de especialización.</strong> Son encuentros en grupos reducidos. Cada encuentro se enfocará en tareas puntuales del trabajo de quienes participan y se trabajará con casos prácticos. Entre un encuentro y otro, cada persona deberá aplicar lo visto para poder traer consultas y dudas.</p>
     <p>Los cupos son limitados. Divino arma los grupos en base al interés expresado y al resultado del barómetro de cada persona.</p>`},
  t:"¿Te gustaría participar de los talleres de especialización?",
  ops:[
    {t:"Sí, me interesa y me comprometo a practicar entre encuentros"},
    {t:"Sí, me interesa, pero hoy mi agenda me deja poco margen para practicar"},
    {t:"No, por ahora prefiero seguir practicando por mi cuenta"},
    {t:"Prefiero no, pero voy a pensarlo para el futuro"}
  ],
  /* segunda pregunta del mismo paso: aparece y es obligatoria solo con el sí */
  abierta:{label:"Contanos por qué, y qué te gustaría aprender.",
    ph:"Tu motivo y lo que querés aprender",
    err:"Contanos por qué, y qué te gustaría aprender."}},

/* 10 · qué temas quieren ver — texto libre, obligatoria.
   Aparece solo si en el paso 9 dijo que sí. Cuenta como paso hasta que el 9
   esté respondido: el total baja, nunca sube. */
{id:"p10", tipo:"largo", eyebrow:"Seguir", req:true,
  si:()=>R.p9===undefined || INTERES.includes(R.p9),
  t:"¿Qué temas te gustaría ver en los talleres de especialización?",
  hint:"Escribilo como lo dirías vos.",
  ph:"Los temas que te gustaría ver",
  err:"Contanos qué temas te gustaría ver."},

/* 11 · cierre — opcional */
{id:"p11", tipo:"largo", eyebrow:"Para terminar", opcional:true,
  t:"¿Algo que quieras agregar?",
  ph:"Lo que quieras contarnos"}
];

/* ---------- estado ---------- */

const R = {};              // respuestas crudas
let paso = 0;              // 0 = intro · 1..pasos · pasos+1 = agradecimiento

/* los pasos que aplican: el 10 depende de lo que se contestó en el 9 */
const visibles = () => Q.filter(q=>!q.si || q.si());

const $ = s => document.querySelector(s);
const shell = $("#shell"), nav = $("#nav"), bar = $("#bar");
const btnNext = $("#next"), btnBack = $("#back");

/* ---------- render ---------- */

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  window.scrollTo(0,0);
  if(CERRADO) return renderCierre();
  const V = visibles(), T = V.length;
  bar.hidden = (paso===0 || paso>T);
  if(paso===0) return renderIntro();
  if(paso>T) return renderGracias();
  renderPregunta(V[paso-1]);
  actualizarContador();
  btnBack.hidden = false;
  nav.hidden = false;
}

/* barra y botón: el total cambia si el paso 10 aparece o se va.
   Segunda línea: temas respondidos, en el paso que tiene varios */
function actualizarContador(){
  const V = visibles(), T = V.length, q = V[paso-1];
  $("#fill").style.width = (paso/T*100)+"%";
  $("#count").textContent = `Paso ${paso} de ${T}`;
  $("#countsub").textContent = q && q.subProgreso ? q.subProgreso() : "";
  btnNext.textContent = paso===T ? "Enviar" : "Siguiente";
}

function renderIntro(){
  btnBack.hidden = true;
  btnNext.textContent = "Empezar";
  nav.hidden = false;
  shell.innerHTML = `
  <div class="intro">
   <div class="card">
    <h1>Gracias por participar en esta master class</h1>
    <p class="lead">Te pedimos cinco minutos para contarnos qué te llevás de hoy. Lo que respondas define los encuentros que vienen, así que es la forma más directa de pedir lo que querés aprender.</p>
    <p><strong>Contestá con lo primero que te salga.</strong> Cada respuesta sirve: lo que buscamos es cómo te llegó el encuentro, teniendo la charla fresca.</p>
    <p><span class="pill">${visibles().length} pasos · 5 minutos</span></p>
   </div>
    <div class="nota">
      <span class="nota-ico" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4B2C7A" stroke-width="2.5" stroke-linecap="round"><path d="M12 8h.01"/><path d="M12 12v4"/></svg></span>
      <p><strong>Qué recibe Divino.</strong> Tu nombre, tu correo y tu interés en los talleres de especialización, para tenerte en cuenta en los grupos de especialización. El resto llegará de forma estadística, y las dudas y comentarios, sin nombres.</p>
    </div>
  </div>`;
}

function renderCierre(){
  bar.hidden = true; nav.hidden = true;
  shell.innerHTML = `
  <div class="intro">
   <div class="card">
    <h1>El formulario ya cerró</h1>
    <p class="lead">Recibimos respuestas hasta el miércoles 30 de septiembre a la noche. Gracias por acercarte.</p>
   </div>
  </div>`;
}

function renderPregunta(q){
  let h = `<div style="padding-top:6px">`;
  h += `<div class="eyebrow">${esc(q.eyebrow)}${q.opcional ? `<span class="opc">Opcional</span>` : ""}</div>`;
  if(q.caso) h += `<div class="caso"><span class="caso-lbl">${esc(q.caso.lbl)}</span>${q.caso.html}</div>`;
  h += `<h2 class="q">${esc(q.t)}</h2>`;
  if(q.hint) h += `<p class="hint">${esc(q.hint)}</p>`;
  else h += `<div style="height:14px"></div>`;

  if(q.tipo==="campos")   h += bloqueCampos(q);
  if(q.tipo==="texto")    h += bloqueTexto(q);
  if(q.tipo==="largo")    h += bloqueLargo(q);
  if(q.tipo==="radio")    h += bloqueOps(q);
  if(q.tipo==="escala")   h += bloqueEscala(q);
  if(q.tipo==="claridad") h += bloqueClaridad(q);

  h += `</div>`;
  shell.innerHTML = h;
  cablear(q);
}

function bloqueCampos(q){
  return q.campos.map(c=>`<div class="field">
    <label class="fl" for="c-${c.id}">${esc(c.label)}</label>
    <input type="${c.mail?"email":"text"}" id="c-${c.id}" placeholder="${esc(c.ph)}"
      value="${esc(R[c.id]||"")}" autocomplete="${c.ac}"
      autocapitalize="${c.cap}" spellcheck="false"></div>`).join("");
}

function bloqueTexto(q){
  return `<div class="field"><input type="text" id="in" placeholder="${esc(q.ph)}"
    value="${esc(R[q.id]||"")}" autocomplete="off"></div>`;
}
function bloqueLargo(q){
  return `<div class="field"><textarea id="in" placeholder="${esc(q.ph)}">${esc(R[q.id]||"")}</textarea></div>`;
}

function bloqueOps(q){
  const sel = R[q.id];
  let h = `<div class="opts">`;
  q.ops.forEach((op,i)=>{
    h += `<label class="opt${sel===i?" sel":""}" data-i="${i}">
      <span class="mark radio"></span>
      <span class="opt-txt">${esc(op.t)}</span></label>`;
  });
  h += `</div>`;
  // segunda pregunta del mismo paso, debajo de las opciones
  if(q.abierta) h += `<div class="field abierta ab-wrap${INTERES.includes(sel)?" on":""}" id="ab-wrap">
    <label class="fl" for="ab">${esc(q.abierta.label)}</label>
    <textarea id="ab" placeholder="${esc(q.abierta.ph)}">${esc(R[q.id+"_por_que"]||"")}</textarea></div>`;
  return h;
}

function bloqueEscala(q){
  return `<div class="escala5" id="escala">
    <div class="nums">${[1,2,3,4,5].map(n=>
      `<button type="button" class="num${R[q.id]===n?" sel":""}" data-v="${n}" aria-label="${n} de 5">${n}</button>`).join("")}</div>
    <div class="nums-lbl"><span>${esc(q.extremos[0])}</span><span>${esc(q.extremos[1])}</span></div>
  </div>`;
}

function bloqueClaridad(q){
  const vals = R[q.id] || {};
  return `<div class="temas" id="temas">${TEMAS.map(tm=>`
    <div class="item tema${vals[tm.k]!==undefined?" done":""}" data-k="${tm.k}">
      <div class="tema-head"><span class="estado"></span><span class="item-txt">${esc(tm.t)}</span></div>
      <div class="chips">${NIVELES.map((n,i)=>
        `<button type="button" class="chip${vals[tm.k]===i?" sel":""}" data-i="${i}">${esc(n)}</button>`).join("")}</div>
    </div>`).join("")}</div>`;
}

/* ---------- interacción ---------- */

function cablear(q){
  if(q.tipo==="campos"){
    q.campos.forEach((c,i)=>{
      const el = $("#c-"+c.id);
      el.addEventListener("input",()=>{R[c.id]=el.value.trim()});
      if(i===0) setTimeout(()=>el.focus(),120);
    });
  }

  if(q.tipo==="texto"||q.tipo==="largo"){
    const el = $("#in");
    el.addEventListener("input",()=>{R[q.id]=el.value.trim()});
    if(q.tipo==="texto") setTimeout(()=>el.focus(),120);
  }

  if(q.tipo==="radio"){
    shell.querySelectorAll(".opt[data-i]").forEach(l=>{
      l.addEventListener("click",()=>{
        const i = +l.dataset.i;
        R[q.id] = i;
        shell.querySelectorAll(".opt[data-i]").forEach(o=>o.classList.toggle("sel",o===l));
        if(q.abierta){
          const on = INTERES.includes(i);
          $("#ab-wrap").classList.toggle("on",on);
          if(!on){ R[q.id+"_por_que"] = ""; $("#ab").value = ""; despejar($("#ab")); }
          actualizarContador();
        }
      });
    });
    if(q.abierta){
      const el = $("#ab");
      el.addEventListener("input",()=>{R[q.id+"_por_que"]=el.value.trim()});
    }
  }

  if(q.tipo==="escala"){
    shell.querySelectorAll(".num").forEach(b=>{
      b.addEventListener("click",()=>{
        R[q.id] = +b.dataset.v;
        shell.querySelectorAll(".num").forEach(x=>x.classList.toggle("sel",x===b));
      });
    });
  }

  if(q.tipo==="claridad"){
    R[q.id] = R[q.id] || {};
    shell.querySelectorAll(".tema .chip").forEach(b=>{
      b.addEventListener("click",()=>{
        const tema = b.closest(".tema");
        R[q.id][tema.dataset.k] = +b.dataset.i;
        tema.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===b));
        tema.classList.add("done");
        tema.classList.remove("invalid");
        // el mensaje general cuenta en vivo los temas que siguen marcados
        const cont = $("#temas");
        if(cont.classList.contains("invalid")){
          const n = cont.querySelectorAll(".tema.invalid").length;
          if(!n) despejar(cont);
          else cont.nextElementSibling.textContent = n===1
            ? "Queda un tema por responder: está marcado en rojo."
            : `Quedan ${n} temas por responder: están marcados en rojo.`;
        }
        actualizarContador();
      });
    });
  }
}

/* ---------- validación ----------
   Mismo criterio que el barómetro: cada error se marca en su campo, con el
   mensaje debajo, y se despeja cuando la persona toca ese campo.
   Obligatorio: todo, salvo los pasos marcados como opcionales. El por qué del
   paso 9 y el paso 10 son obligatorios cuando aparecen. Los textos abiertos
   llevan el mismo largo mínimo que en el barómetro, también los opcionales
   cuando se escriben. */

const MIN_TEXTO = 15;     // caracteres

function limpiarErrores(){
  shell.querySelectorAll(".invalid").forEach(e=>e.classList.remove("invalid"));
  shell.querySelectorAll(".err").forEach(e=>e.remove());
}

function despejar(t){
  const inv = t.closest && t.closest(".invalid");
  if(!inv) return;
  if(inv.classList.contains("tema")) return;                            // se despeja al responderse
  if(inv.id==="temas" && inv.querySelector(".tema.invalid")) return;   // se despeja con el último tema
  inv.classList.remove("invalid");
  const s = inv.nextElementSibling;
  if(s && s.classList.contains("err")) s.remove();
}

function validar(q){
  limpiarErrores();
  const errs = [];
  const marcar = (el,msg)=>{
    if(!el) return;
    el.classList.add("invalid");
    if(msg){
      const d = document.createElement("div");
      d.className = "err"; d.textContent = msg;
      el.insertAdjacentElement("afterend",d);
    }
    errs.push(el);
  };
  const texto = (el,v,msgVacio)=>{
    v = v||"";
    if(!v) marcar(el,msgVacio);
    else if(v.length<MIN_TEXTO) marcar(el,`Sumá un poco más de detalle: al menos ${MIN_TEXTO} caracteres.`);
  };

  if(q.tipo==="campos"){
    const nom = R.nombre||"", mail = R.mail||"";
    if(!nom) marcar($("#c-nombre"),"Escribí tu nombre y apellido.");
    else if(nom.split(/\s+/).length<2) marcar($("#c-nombre"),"Sumá tu apellido.");
    if(!mail) marcar($("#c-mail"),"Escribí tu correo.");
    else if(!mail.includes("@")) marcar($("#c-mail"),"Al correo le falta la @.");
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail))
      marcar($("#c-mail"),"Revisá el correo: tiene que quedar como nombre@dominio.com.");
  }

  if(q.tipo==="texto" && q.req && (R[q.id]||"").length<2)
    marcar($("#in"), q.err);

  if(q.tipo==="largo" && (q.req || R[q.id]))
    texto($("#in"), R[q.id], q.err);

  if(q.tipo==="radio"){
    const i = R[q.id];
    if(i===undefined) marcar(shell.querySelector(".opts"),"Elegí una opción para seguir.");
    if(q.abierta && INTERES.includes(i)) texto($("#ab"), R[q.id+"_por_que"], q.abierta.err);
  }

  if(q.tipo==="escala" && R[q.id]===undefined)
    marcar($("#escala"),"Tocá un número del 1 al 5.");

  if(q.tipo==="claridad"){
    const vals = R[q.id]||{};
    const pend = [...shell.querySelectorAll(".tema")].filter(t=>vals[t.dataset.k]===undefined);
    if(pend.length){
      marcar($("#temas"), pend.length===1 ? "Queda un tema por responder: está marcado en rojo."
                                          : `Quedan ${pend.length} temas por responder: están marcados en rojo.`);
      pend.forEach(t=>t.classList.add("invalid"));
      errs.unshift(pend[0]);
    }
  }

  if(errs.length){
    const el = errs[0];
    el.scrollIntoView({behavior:"smooth",block:"center"});
    if(el.matches("input,textarea")) el.focus({preventScroll:true});
    return false;
  }
  return true;
}

/* ---------- agradecimiento ---------- */

function renderGracias(){
  nav.hidden = true;
  shell.innerHTML = `
  <div class="resultado">
    <div class="eyebrow">Master class · Divino</div>
    <h1>¡Gracias por tu tiempo!</h1>
    <div class="card">
      <p class="card-intro">Con tu respuesta vamos a trabajar en los grupos para los próximos encuentros.</p>
    </div>
    <div class="envio" id="envio">Guardando tu respuesta…</div>
  </div>`;

  enviar();
}

/* ---------- envío ---------- */

function payload(){
  const nombreOp = id=>{const q=Q.find(x=>x.id===id), i=R[id]; return (i===undefined||!q.ops[i])?"":q.ops[i].t};
  const claridad = Object.fromEntries(TEMAS.map(tm=>{
    const i = (R.p4||{})[tm.k];
    return ["p4_claridad_"+tm.k, i===undefined ? "" : NIVELES[i]];
  }));

  return {
    timestamp:new Date().toISOString(),
    nombre:R.nombre||"", mail:(R.mail||"").toLowerCase(),

    p2_utilidad:R.p2,
    p3_de_que_se_trato:R.p3||"",
    ...claridad,
    p5_mas_util:R.p5||"",
    p6_distinto:R.p6||"",
    p7_tarea_semana:R.p7||"",
    p8_dando_vueltas:R.p8||"",
    p9_talleres:nombreOp("p9"), p9_por_que:R.p9_por_que||"",
    p10_temas:visibles().some(q=>q.id==="p10") ? (R.p10||"") : "",
    p11_agregar:R.p11||""
  };
}

async function enviar(){
  const data = payload();
  const box = $("#envio");
  try{ localStorage.setItem("masterclass_divino", JSON.stringify(data)) }catch(e){}

  if(!ENDPOINT){
    box.textContent = "Modo local: la respuesta quedó en este navegador.";
    console.log("[master class] payload", data);
    return;
  }
  try{
    const res = await fetch(ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},   // request simple, sin preflight
      body:JSON.stringify(data)
    });
    const j = await res.json().catch(()=>({}));
    if(j.cerrado){
      box.className = "envio err";
      box.textContent = "El formulario cerró el miércoles 30 de septiembre, antes de que llegara esta respuesta.";
      return;
    }
    if(!res.ok || !j.ok) throw new Error(j.error || res.status);
    box.textContent = "Tu respuesta quedó registrada.";
  }catch(e){
    box.className = "envio err";
    box.textContent = "Tu respuesta quedó guardada en este navegador. El envío falló: avisale a quien te compartió el link.";
    console.error("[master class] envío", e);
  }
}

/* ---------- navegación ---------- */

btnNext.addEventListener("click",()=>{
  const V = visibles();
  if(paso>0 && paso<=V.length && !validar(V[paso-1])) return;
  paso++; render();
});
btnBack.addEventListener("click",()=>{ if(paso>0){paso--; render()} });

/* la marca de error se despeja en cuanto la persona toca el campo marcado */
shell.addEventListener("input",e=>despejar(e.target));
shell.addEventListener("click",e=>despejar(e.target));

render();
</script>
